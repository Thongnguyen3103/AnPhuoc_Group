# ============================================================
#  Cau hinh RIENG cua project Report_LCHH
# ============================================================
# Duong dan NGUON DU LIEU GOC (Lenh_HHLC, History_LC, TraKho, Region,
# Sales) KHONG khai bao o day -> lay tu file dung chung toan workspace:
# 01.Python_Projects/00.Shared/Config_LCHH.yaml (doc qua Get_Paths trong Core/Load_Config.py).

# Thang chay mac dinh (dinh dang YYYY-MM).
# Uu tien tham so dong lenh -> vi du: python Build_Master_LC.py 2026-10
# Neu khong truyen tham so thi hoi tren man hinh, Enter -> lay 'periods' duoi day.
periods:
  - "2026-10"

# So ngay ke tu ngay lenh ma lenh phai duoc thuc hien. Qua han van tinh nhap, chi danh dau tre.
han_thuc_hien_ngay: 15

# Anh xa ten cua hang khong khop sau khi da chuan hoa hoa thuong.
# key = ten trong file Lenh, value = ten chuan.
# Hien tai viec ha hoa thuong da xu ly het cac case biet -> de trong.
store_alias: {}

# output de trong = mac dinh dung thu muc 04.Output/Report_LCHH/ o goc project (khuyen dung,
# de tat ca ket qua tap trung 1 noi). Chi dien gia tri neu that su can doi.
output_dir: ""
